pluginManagement {
    apply from: 'config.gradle'

    plugins {
        id 'io.github.gradle-nexus.publish-plugin' version versions.nexusPublishVersion
        id 'com.android.library' version versions.gradlePluginVersion
        id 'org.jetbrains.kotlin.android' version versions.kotlinVersion
    }
    repositories {
        gradlePluginPortal()
        google()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
        maven { url "https://s01.oss.sonatype.org/content/repositories/snapshots/"}
    }
}

rootProject.name= "GAST"

include ':core'
include ':samples:edittextsample'
include ':samples:video_demo'
include ':samples:webview_demo'
include ':samples:spatial_app'
include ':samples:xrapp:hello_vr_world'
include ':samples:xrapp:xrmediaviewer'
